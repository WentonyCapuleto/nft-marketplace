services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kurio
      POSTGRES_USER: kurio
      POSTGRES_PASSWORD: kurio_dev_password
    ports:
      - "5432:5432"
    volumes:
      - kurio_pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurio -d kurio"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: kurio_test
      POSTGRES_USER: kurio
      POSTGRES_PASSWORD: kurio_test_password
    ports:
      - "5433:5432"
    volumes:
      - kurio_test_pgdata:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurio -d kurio_test"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kurio_pgdata:
  kurio_test_pgdata:
